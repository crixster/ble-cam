<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    #viewfinderWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    canvas { display: none; }

    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.05s ease-out;
    }
    .screen-flash.active {
      opacity: 0.95;
    }

    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 2;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .countdown-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    /* --- MINIMALIST UI --- */
    
    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      margin: 0;
      z-index: 4;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      background: rgba(0,0,0,0.3);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .minimal-controls {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      z-index: 6;
      pointer-events: none;
    }

    /* Minimalist Gear Icon Button */
    .round-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .round-btn:active { background: rgba(255, 255, 255, 0.2); }
    .round-btn svg { width: 24px; height: 24px; opacity: 0.9; }

    /* Classic Camera Shutter Ring */
    .shutter-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: transparent;
      border: 3px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .shutter-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transition: background 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); }
    .shutter-btn:active .shutter-inner { background: rgba(255, 255, 255, 1); }

    /* --- FLOATING SETTINGS CARD --- */
    .controls-overlay {
      position: absolute;
      bottom: 140px; /* Floats ABOVE the gear and shutter buttons */
      left: 50%;
      transform: translate(-50%, 20px);
      width: 90%;
      max-width: 380px;
      background: rgba(20, 20, 20, 0.65); /* Semi-transparent glass */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .controls-overlay.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .top-bar { display: flex; justify-content: space-between; gap: 6px; }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-grow: 1;
      transition: background 0.2s;
    }
    .icon-btn.active { background: #007aff; border-color: #007aff; }

    .lens-bar { display: flex; justify-content: space-between; gap: 8px; }
    .lens-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #ccc;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-grow: 1;
      text-align: center;
      transition: all 0.2s;
    }
    .lens-btn.active { background: #ffcc00; color: #000; }

    .slider-group { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #aaa; }
    .slider-group label { min-width: 75px; color: #fff; font-weight: 500; }
    input[type=range] { flex-grow: 1; accent-color: #007aff; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); }

    .btn-row { display: flex; gap: 8px; }
    .main-btn {
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
    }
    #installBtn { background: #34c759; display: none; }
  </style>
</head>
<body>

  <div id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="focus-ring" id="focusRing"></div>
    <div class="countdown-overlay" id="countdown"></div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <p id="status">Ready • Press earbud to snap</p>

  <!-- Minimalist Floating Controls -->
  <div class="minimal-controls">
    <button class="round-btn" id="toggleMenuBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    
    <button class="shutter-btn" id="floatingSnapBtn" aria-label="Take Photo">
      <div class="shutter-inner"></div>
    </button>
    
    <div style="width: 54px;"></div> <!-- Spacer to center the shutter button -->
  </div>

  <!-- Floating Settings Card -->
  <div class="controls-overlay" id="fullControls">
    <div class="top-bar">
      <button class="icon-btn" id="flashBtn">⚡ Flash: Off</button>
      <button class="icon-btn" id="timerBtn">⏱️ Timer</button>
      <button class="icon-btn" id="flipBtn">🔄 Flip</button>
    </div>

    <div class="lens-bar">
      <button class="lens-btn active" data-zoom="1">1x Lens</button>
      <button class="lens-btn" data-zoom="2">2x Lens</button>
    </div>

    <div class="slider-group">
      <label id="zoomLabel">Zoom: 1.0x</label>
      <input type="range" id="zoomSlider" min="1" max="10" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label id="expLabel">Bright: 0%</label>
      <input type="range" id="exposureSlider" min="50" max="150" step="1" value="100">
    </div>

    <div class="btn-row">
      <button class="main-btn" id="installBtn">📲 Install App</button>
    </div>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    const focusRing = document.getElementById('focusRing');
    const countdownEl = document.getElementById('countdown');
    const viewfinderWrapper = document.getElementById('viewfinderWrapper');
    const screenFlash = document.getElementById('screenFlash');

    const fullControls = document.getElementById('fullControls');
    const flashBtn = document.getElementById('flashBtn');
    const timerBtn = document.getElementById('timerBtn');
    const flipBtn = document.getElementById('flipBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const exposureSlider = document.getElementById('exposureSlider');
    const expLabel = document.getElementById('expLabel');
    const lensButtons = document.querySelectorAll('.lens-btn');

    let activeStream = null;
    let track = null;
    let capabilities = null;
    let audioCtx = null;
    let currentFacingMode = "environment";
    let flashMode = 0; 
    let timerSetting = 0; 
    let isCountingDown = false;

    const TORCH_SETTLE_MS = 800;          
    const COUNTDOWN_PULSE_MS = 130;       
    const TIMER_TO_CAPTURE_PAUSE = 400;   

    let torchQueue = Promise.resolve();
    let internalTorchState = false;

    // Toggle the floating settings card
    document.getElementById('toggleMenuBtn').onclick = () => {
      fullControls.classList.toggle('visible');
    };

    function setTorch(on) {
      torchQueue = torchQueue.then(async () => {
        if (!track || !capabilities || !capabilities.torch || currentFacingMode === 'user') return;
        if (internalTorchState === on) return;
        try {
          await track.applyConstraints({ advanced: [{ torch: on }] });
          internalTorchState = on;
        } catch (e) {}
      });
      return torchQueue;
    }

    async function initCamera() {
      try {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });

        video.srcObject = activeStream;
        await video.play();

        track = activeStream.getVideoTracks()[0];
        capabilities = track.getCapabilities ? track.getCapabilities() : {};
        internalTorchState = false;

        if (capabilities.zoom) {
          zoomSlider.min = capabilities.zoom.min;
          zoomSlider.max = Math.min(10, capabilities.zoom.max);
          zoomSlider.step = capabilities.zoom.step;
        } else {
          zoomSlider.min = 1;
          zoomSlider.max = 1;
        }

        applyZoom(1);

        if (flashMode === 2 && capabilities.torch) await setTorch(true);

        status.innerText = "Ready • Press earbud to snap";
      } catch (err) {
        status.innerText = "Camera Error: " + err.message;
      }
    }

    async function applyZoom(val) {
      val = parseFloat(val);
      zoomSlider.value = val;
      zoomLabel.innerText = `Zoom: ${val.toFixed(1)}x`;

      lensButtons.forEach(btn => {
        if (parseFloat(btn.dataset.zoom) === val) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      try {
        if (track && capabilities.zoom) {
          const clampedVal = Math.max(capabilities.zoom.min, Math.min(capabilities.zoom.max, val));
          await track.applyConstraints({ advanced: [{ zoom: clampedVal }] });
        }
      } catch (e) {}
    }

    lensButtons.forEach(btn => {
      btn.onclick = () => applyZoom(parseFloat(btn.dataset.zoom));
    });

    zoomSlider.oninput = () => applyZoom(parseFloat(zoomSlider.value));

    flashBtn.onclick = async () => {
      flashMode = (flashMode + 1) % 3;
      if (flashMode === 0) {
        flashBtn.innerText = "⚡ Flash: Off";
        flashBtn.classList.remove('active');
        await setTorch(false);
      } else if (flashMode === 1) {
        flashBtn.innerText = "⚡ Flash: ON";
        flashBtn.classList.add('active');
        await setTorch(false);
      } else if (flashMode === 2) {
        flashBtn.innerText = "🔦 Light: Always-On";
        flashBtn.classList.add('active');
        await setTorch(true);
      }
    };

    exposureSlider.oninput = () => {
      const val = parseInt(exposureSlider.value);
      expLabel.innerText = `Bright: ${val}%`;
      video.style.filter = `brightness(${val}%)`;
    };

    flipBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      initCamera();
    };

    timerBtn.onclick = () => {
      if (timerSetting === 0) {
        timerSetting = 3;
        timerBtn.innerText = '⏱️ 3s';
        timerBtn.classList.add('active');
      } else if (timerSetting === 3) {
        timerSetting = 10;
        timerBtn.innerText = '⏱️ 10s';
        timerBtn.classList.add('active');
      } else {
        timerSetting = 0;
        timerBtn.innerText = '⏱️ Timer';
        timerBtn.classList.remove('active');
      }
    };

    viewfinderWrapper.addEventListener('click', async (e) => {
      // Ignore clicks on the floating buttons or settings panel
      if (e.target.closest('.minimal-controls') || e.target.closest('.controls-overlay')) return;

      const rect = viewfinderWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      if (track && capabilities.focusMode) {
        try { await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }); } catch (err) {}
      }
    });

    /**
     * AUTHENTIC SHUTTER SOUND (Refined)
     * Uses high-passed noise bursts + a fast pitch drop to simulate a sharp mechanical mirror slap.
     */
    function playDslrShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;

        function createMechanicalClick(startTime, duration, isSecondClick) {
          // 1. Sharp High-Frequency Noise (The "Snick")
          const bufferSize = audioCtx.sampleRate * duration;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = isSecondClick ? 3000 : 5000;
          filter.Q.value = 1.5;

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.setValueAtTime(0.8, startTime);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);

          noise.start(startTime);
          noise.stop(startTime + duration);

          // 2. Fast Low-Frequency Transient (The "Clack")
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(isSecondClick ? 250 : 400, startTime);
          osc.frequency.exponentialRampToValueAtTime(80, startTime + duration);
          
          oscGain.gain.setValueAtTime(0.4, startTime);
          oscGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(oscGain);
          oscGain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        // 1st Click: Mirror swinging up
        createMechanicalClick(now, 0.02, false);
        
        // 2nd Click: Shutter curtain closing (happens 60ms later)
        createMechanicalClick(now + 0.06, 0.03, true);

      } catch (e) {}
    }

    async function runCountdownBlink(seconds) {
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      for (let i = seconds; i > 0; i--) {
        countdownEl.innerText = i;
        countdownEl.style.display = 'block';

        if (hasTorch) {
          await setTorch(true);
          await new Promise(r => setTimeout(r, COUNTDOWN_PULSE_MS));
          await setTorch(false);
          await new Promise(r => setTimeout(r, 1000 - COUNTDOWN_PULSE_MS));
        } else {
          screenFlash.classList.add('active');
          setTimeout(() => screenFlash.classList.remove('active'), COUNTDOWN_PULSE_MS);
          await new Promise(r => setTimeout(r, 1000));
        }
      }
      countdownEl.style.display = 'none';
      if (hasTorch) await setTorch(false);
      await new Promise(r => setTimeout(r, TIMER_TO_CAPTURE_PAUSE));
    }

    function triggerCapture() {
      if (isCountingDown || !video.videoWidth) return;

      if (timerSetting > 0) {
        isCountingDown = true;
        runCountdownBlink(timerSetting).then(() => {
          isCountingDown = false;
          executeCaptureSequence();
        });
      } else {
        executeCaptureSequence();
      }
    }

    async function executeCaptureSequence() {
      const isFlashOn = (flashMode === 1);
      const isAlwaysOn = (flashMode === 2);
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      try {
        if ((isFlashOn || isAlwaysOn) && hasTorch) {
          await setTorch(true);
          await new Promise(r => setTimeout(r, TORCH_SETTLE_MS));
        }

        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), 120);
        playDslrShutterSound();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = video.style.filter || 'none';
        ctx.drawImage(video, 0, 0);

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `photo_${Date.now()}.jpg`;
        link.click();

        status.innerText = "✨ Photo Saved!";
        setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
      } finally {
        if (hasTorch) {
          if (isAlwaysOn) await setTorch(true);
          else await setTorch(false);
        }
      }
    }

    document.getElementById('floatingSnapBtn').onclick = triggerCapture;

    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', triggerCapture);
      navigator.mediaSession.setActionHandler('pause', triggerCapture);
      navigator.mediaSession.setActionHandler('previoustrack', triggerCapture);
      navigator.mediaSession.setActionHandler('nexttrack', triggerCapture);
    }

    initCamera();
  </script>
</body>
</html>
