<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }
    .viewfinder-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas { display: none; }
    
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    .btn-row { display: flex; gap: 10px; }
    button {
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
    }
    #installBtn { background: #34c759; display: none; }
    #status { font-size: 12px; color: #ff9f0a; text-align: center; margin: 0; }
  </style>
</head>
<body>

  <div class="viewfinder-container" id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <canvas id="photoCanvas"></canvas>
  </div>

  <div class="controls-overlay">
    <div class="btn-row">
      <button id="snapBtn">📸 Take Photo</button>
      <button id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Requesting camera access...</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // 1. Register Service Worker for PWA compliance
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // 2. Install Prompt Handler
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // 3. Fallback Camera Initializer
    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    let audioCtx = null;
    let activeStream = null;

    async function initCamera() {
      const constraintsToTry = [
        { video: { facingMode: { ideal: "environment" } }, audio: false },
        { video: { facingMode: "user" }, audio: false },
        { video: true, audio: false }
      ];

      for (const constraints of constraintsToTry) {
        try {
          if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
          }
          activeStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = activeStream;
          
          // Force playback on Android webview engine
          await video.play();
          
          status.innerText = "Ready • Tap screen or press earbud";
          return; // Success: exit function
        } catch (err) {
          console.warn("Constraint attempt failed:", constraints, err);
        }
      }

      status.innerText = "Camera Access Blocked. Check site permissions.";
    }

    // 4. Shutter Sound Synthesizer
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // 5. Photo Capture
    function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        status.innerText = "Error: Video stream not ready";
        return;
      }
      
      playShutterSound();
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.download = `photo_${Date.now()}.jpg`;
      link.click();
      
      status.innerText = "✨ Photo Saved!";
      setTimeout(() => {
        if (video.paused) video.play().catch(() => {});
        status.innerText = "Ready • Press earbud to snap";
      }, 1500);
    }

    document.getElementById('snapBtn').onclick = takePhoto;

    // 6. Media Key Session Listener
    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (video.paused) video.play().catch(() => {});
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', takePhoto);
      navigator.mediaSession.setActionHandler('pause', takePhoto);
      navigator.mediaSession.setActionHandler('previoustrack', takePhoto);
      navigator.mediaSession.setActionHandler('nexttrack', takePhoto);
    }

    // Launch camera stream
    initCamera();
  </script>
</body>
</html>
