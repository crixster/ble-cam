<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    #viewfinderWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    canvas { display: none; }

    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.05s ease-out;
    }
    .screen-flash.active {
      opacity: 0.95;
    }

    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 2;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .countdown-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-grow: 1;
    }
    .icon-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .lens-bar {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .lens-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ccc;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-grow: 1;
      text-align: center;
      transition: all 0.2s;
    }
    .lens-btn.active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .slider-group label { min-width: 75px; color: #fff; font-weight: 500; }
    input[type=range] {
      flex-grow: 1;
      accent-color: #007aff;
      height: 6px;
      border-radius: 3px;
      background: #333;
    }

    .btn-row { display: flex; gap: 8px; }
    .main-btn {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
    }
    #installBtn { background: #34c759; display: none; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4); }
    #status { font-size: 11px; color: #888; text-align: center; margin: 0; }
  </style>
</head>
<body>

  <div id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="focus-ring" id="focusRing"></div>
    <div class="countdown-overlay" id="countdown"></div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <div class="controls-overlay">
    <div class="top-bar">
      <button class="icon-btn" id="flashBtn">⚡ Flash: Off</button>
      <button class="icon-btn" id="timerBtn">⏱️ Timer</button>
      <button class="icon-btn" id="flipBtn">🔄 Flip</button>
    </div>

    <div class="lens-bar">
      <button class="lens-btn active" data-zoom="1">1x</button>
      <button class="lens-btn" data-zoom="2">2x</button>
    </div>

    <div class="slider-group">
      <label id="zoomLabel">Zoom: 1.0x</label>
      <input type="range" id="zoomSlider" min="1" max="10" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label id="expLabel">Bright: 0%</label>
      <input type="range" id="exposureSlider" min="50" max="150" step="1" value="100">
    </div>

    <div class="btn-row">
      <button class="main-btn" id="snapBtn">📸 Take Photo</button>
      <button class="main-btn" id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Tap screen to activate audio & remote</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    const focusRing = document.getElementById('focusRing');
    const countdownEl = document.getElementById('countdown');
    const viewfinderWrapper = document.getElementById('viewfinderWrapper');
    const screenFlash = document.getElementById('screenFlash');

    const flashBtn = document.getElementById('flashBtn');
    const timerBtn = document.getElementById('timerBtn');
    const flipBtn = document.getElementById('flipBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const exposureSlider = document.getElementById('exposureSlider');
    const expLabel = document.getElementById('expLabel');
    const lensButtons = document.querySelectorAll('.lens-btn');

    let activeStream = null;
    let track = null;
    let capabilities = null;
    let audioCtx = null;
    let currentFacingMode = "environment";
    let flashMode = 0; 
    let timerSetting = 0; 
    let isCountingDown = false;

    const TORCH_SETTLE_MS = 800;          // Wait for sensor AE to adjust to LED
    const COUNTDOWN_PULSE_MS = 130;       
    const TIMER_TO_CAPTURE_PAUSE = 400;   

    let torchQueue = Promise.resolve();
    let internalTorchState = false;

    function setTorch(on) {
      torchQueue = torchQueue.then(async () => {
        if (!track || !capabilities || !capabilities.torch || currentFacingMode === 'user') return;
        if (internalTorchState === on) return;
        try {
          await track.applyConstraints({ advanced: [{ torch: on }] });
          internalTorchState = on;
        } catch (e) {}
      });
      return torchQueue;
    }

    async function initCamera() {
      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });

        video.srcObject = activeStream;
        await video.play();

        track = activeStream.getVideoTracks()[0];
        capabilities = track.getCapabilities ? track.getCapabilities() : {};
        internalTorchState = false;

        if (capabilities.zoom) {
          zoomSlider.min = capabilities.zoom.min; // Should be 1.0
          zoomSlider.max = Math.min(10, capabilities.zoom.max); // Cap at 10x
          zoomSlider.step = capabilities.zoom.step;
        } else {
          zoomSlider.min = 1;
          zoomSlider.max = 1; // Disable slider if hardware zoom isn't supported
        }

        applyZoom(1);

        if (flashMode === 2 && capabilities.torch) {
          await setTorch(true);
        }

        status.innerText = "Ready • Press earbud to snap";
      } catch (err) {
        status.innerText = "Camera Error: " + err.message;
      }
    }

    // STRICT HARDWARE ZOOM
    async function applyZoom(val) {
      val = parseFloat(val);
      zoomSlider.value = val;
      zoomLabel.innerText = `Zoom: ${val.toFixed(1)}x`;

      lensButtons.forEach(btn => {
        if (parseFloat(btn.dataset.zoom) === val) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      try {
        if (track && capabilities.zoom) {
          const clampedVal = Math.max(capabilities.zoom.min, Math.min(capabilities.zoom.max, val));
          await track.applyConstraints({ advanced: [{ zoom: clampedVal }] });
        }
      } catch (e) {
        console.warn("Hardware zoom failed", e);
      }
    }

    lensButtons.forEach(btn => {
      btn.onclick = () => applyZoom(parseFloat(btn.dataset.zoom));
    });

    zoomSlider.oninput = () => applyZoom(parseFloat(zoomSlider.value));

    flashBtn.onclick = async () => {
      flashMode = (flashMode + 1) % 3;
      
      if (flashMode === 0) {
        flashBtn.innerText = "⚡ Flash: Off";
        flashBtn.classList.remove('active');
        await setTorch(false);
      } else if (flashMode === 1) {
        flashBtn.innerText = "⚡ Flash: ON";
        flashBtn.classList.add('active');
        await setTorch(false);
      } else if (flashMode === 2) {
        flashBtn.innerText = "🔦 Light: Always-On";
        flashBtn.classList.add('active');
        await setTorch(true);
      }
    };

    exposureSlider.oninput = () => {
      const val = parseInt(exposureSlider.value);
      expLabel.innerText = `Bright: ${val}%`;
      video.style.filter = `brightness(${val}%)`;
    };

    flipBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      initCamera();
    };

    timerBtn.onclick = () => {
      if (timerSetting === 0) {
        timerSetting = 3;
        timerBtn.innerText = '⏱️ 3s';
        timerBtn.classList.add('active');
      } else if (timerSetting === 3) {
        timerSetting = 10;
        timerBtn.innerText = '⏱️ 10s';
        timerBtn.classList.add('active');
      } else {
        timerSetting = 0;
        timerBtn.innerText = '⏱️ Timer';
        timerBtn.classList.remove('active');
      }
    };

    viewfinderWrapper.addEventListener('click', async (e) => {
      if (e.target.closest('.controls-overlay')) return;

      const rect = viewfinderWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      if (track && capabilities.focusMode) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        } catch (err) {}
      }
    });

    // REDESIGNED MECHANICAL SHUTTER SOUND
    function playDslrShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;

        // Helper: Creates a mechanical click using noise + low-frequency thud
        function playMechanicalClick(startTime, noiseFreq, duration, gainMult) {
          // 1. High-frequency filtered noise (the physical "clack" of plastic/metal)
          const bufferSize = audioCtx.sampleRate * duration;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'highpass';
          noiseFilter.frequency.value = noiseFreq;

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.setValueAtTime(gainMult, startTime);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);
          
          // 2. Low-frequency oscillator (the heavy "thud" of the mirror moving)
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(120, startTime);
          osc.frequency.exponentialRampToValueAtTime(40, startTime + duration);
          
          oscGain.gain.setValueAtTime(gainMult * 0.8, startTime);
          oscGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(oscGain);
          oscGain.connect(audioCtx.destination);

          noise.start(startTime);
          noise.stop(startTime + duration);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        // 1st Click: Mirror slaps up (Sharp, bright, very short)
        playMechanicalClick(now, 2500, 0.015, 0.8);
        
        // 2nd Click: Shutter closes (Slightly lower tone, 60ms later)
        playMechanicalClick(now + 0.065, 1500, 0.025, 0.6);

      } catch (e) {}
    }

    async function runCountdownBlink(seconds) {
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      for (let i = seconds; i > 0; i--) {
        countdownEl.innerText = i;
        countdownEl.style.display = 'block';

        if (hasTorch) {
          await setTorch(true);
          await new Promise(r => setTimeout(r, COUNTDOWN_PULSE_MS));
          await setTorch(false);
          await new Promise(r => setTimeout(r, 1000 - COUNTDOWN_PULSE_MS));
        } else {
          screenFlash.classList.add('active');
          setTimeout(() => screenFlash.classList.remove('active'), COUNTDOWN_PULSE_MS);
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      countdownEl.style.display = 'none';

      if (hasTorch) await setTorch(false);
      await new Promise(r => setTimeout(r, TIMER_TO_CAPTURE_PAUSE));
    }

    function triggerCapture() {
      if (isCountingDown || !video.videoWidth) return;

      if (timerSetting > 0) {
        isCountingDown = true;
        runCountdownBlink(timerSetting).then(() => {
          isCountingDown = false;
          executeCaptureSequence();
        });
      } else {
        executeCaptureSequence();
      }
    }

    // FLASH FIXED: Relies on a solid hardware delay rather than buggy brightness sampling
    async function executeCaptureSequence() {
      const isFlashOn = (flashMode === 1);
      const isAlwaysOn = (flashMode === 2);
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      try {
        if ((isFlashOn || isAlwaysOn) && hasTorch) {
          await setTorch(true);
          // Delay to allow physical LED to turn on AND the Android sensor's Auto Exposure
          // to actually update the video stream. Without this, drawImage captures a black frame.
          await new Promise(r => setTimeout(r, TORCH_SETTLE_MS));
        }

        // Trigger screen flash overlay + sound (slight overlap with actual capture)
        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), 120);
        playDslrShutterSound();

        // Capture Frame
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = video.style.filter || 'none';
        
        ctx.drawImage(video, 0, 0);

        // Download
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `photo_${Date.now()}.jpg`;
        link.click();

        status.innerText = "✨ Photo Saved!";
        setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
      } finally {
        if (hasTorch) {
          if (isAlwaysOn) {
            await setTorch(true);
          } else {
            await setTorch(false);
          }
        }
      }
    }

    document.getElementById('snapBtn').onclick = triggerCapture;

    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', triggerCapture);
      navigator.mediaSession.setActionHandler('pause', triggerCapture);
      navigator.mediaSession.setActionHandler('previoustrack', triggerCapture);
      navigator.mediaSession.setActionHandler('nexttrack', triggerCapture);
    }

    initCamera();
  </script>
</body>
</html>
