<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    #viewfinderWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    canvas { display: none; }

    /* Screen Flash Overlay */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.05s ease-out;
    }
    .screen-flash.active {
      opacity: 0.95;
    }

    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 2;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .countdown-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-grow: 1;
    }
    .icon-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .slider-group label { min-width: 75px; color: #fff; font-weight: 500; }
    input[type=range] {
      flex-grow: 1;
      accent-color: #007aff;
      height: 6px;
      border-radius: 3px;
      background: #333;
    }

    .btn-row { display: flex; gap: 8px; }
    .main-btn {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
    }
    #installBtn { background: #34c759; display: none; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4); }
    #status { font-size: 11px; color: #888; text-align: center; margin: 0; }
  </style>
</head>
<body>

  <div id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="focus-ring" id="focusRing"></div>
    <div class="countdown-overlay" id="countdown"></div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <div class="controls-overlay">
    <!-- Top Bar: Flash Mode, Timer, Flip -->
    <div class="top-bar">
      <button class="icon-btn" id="flashBtn">⚡ Flash: Off</button>
      <button class="icon-btn" id="timerBtn">⏱️ Timer</button>
      <button class="icon-btn" id="flipBtn">🔄 Flip</button>
    </div>

    <div class="slider-group">
      <label id="zoomLabel">Zoom: 1.0x</label>
      <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label id="expLabel">Bright: 0%</label>
      <input type="range" id="exposureSlider" min="50" max="150" step="1" value="100">
    </div>

    <div class="btn-row">
      <button class="main-btn" id="snapBtn">📸 Take Photo</button>
      <button class="main-btn" id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Tap screen to activate audio & remote</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // PWA Install Handling
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // Elements
    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    const focusRing = document.getElementById('focusRing');
    const countdownEl = document.getElementById('countdown');
    const viewfinderWrapper = document.getElementById('viewfinderWrapper');
    const screenFlash = document.getElementById('screenFlash');

    const flashBtn = document.getElementById('flashBtn');
    const timerBtn = document.getElementById('timerBtn');
    const flipBtn = document.getElementById('flipBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const exposureSlider = document.getElementById('exposureSlider');
    const expLabel = document.getElementById('expLabel');

    // App State
    let activeStream = null;
    let track = null;
    let capabilities = null;
    let audioCtx = null;
    let currentFacingMode = "environment";
    let flashMode = 0; // 0: Off, 1: Flash ON (Strobe on capture), 2: Light Always-On
    let timerSetting = 0; // 0, 3, or 10 seconds
    let isCountingDown = false;

    // 1. Camera Initialization
    async function initCamera() {
      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });

        video.srcObject = activeStream;
        await video.play();

        track = activeStream.getVideoTracks()[0];
        capabilities = track.getCapabilities ? track.getCapabilities() : {};

        // Reapply Always-On Light if it was active before flipping camera
        if (flashMode === 2 && capabilities.torch) {
          await track.applyConstraints({ advanced: [{ torch: true }] });
        }

        status.innerText = "Ready • Press earbud to snap";
      } catch (err) {
        status.innerText = "Camera Error: " + err.message;
      }
    }

    // 2. Flash Mode Cycling (Off -> Flash ON -> Always-On Light)
    flashBtn.onclick = async () => {
      flashMode = (flashMode + 1) % 3;
      
      if (track && capabilities.torch) {
        try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
      }

      if (flashMode === 0) {
        flashBtn.innerText = "⚡ Flash: Off";
        flashBtn.classList.remove('active');
      } else if (flashMode === 1) {
        flashBtn.innerText = "⚡ Flash: ON";
        flashBtn.classList.add('active');
      } else if (flashMode === 2) {
        flashBtn.innerText = "🔦 Light: Always-On";
        flashBtn.classList.add('active');
        if (track && capabilities.torch) {
          try { await track.applyConstraints({ advanced: [{ torch: true }] }); } catch (e) {}
        }
      }
    };

    // Zoom & Brightness Sliders
    zoomSlider.oninput = async () => {
      const val = parseFloat(zoomSlider.value);
      zoomLabel.innerText = `Zoom: ${val.toFixed(1)}x`;
      try {
        if (capabilities.zoom) {
          await track.applyConstraints({ advanced: [{ zoom: val }] });
        } else {
          video.style.transform = `scale(${val})`;
        }
      } catch (e) {
        video.style.transform = `scale(${val})`;
      }
    };

    exposureSlider.oninput = () => {
      const val = parseInt(exposureSlider.value);
      expLabel.innerText = `Bright: ${val}%`;
      video.style.filter = `brightness(${val}%)`;
    };

    // Camera Flip (Front / Back)
    flipBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      zoomSlider.value = 1;
      zoomLabel.innerText = "Zoom: 1.0x";
      video.style.transform = "scale(1)";
      initCamera();
    };

    // Timer Toggle (Off -> 3s -> 10s)
    timerBtn.onclick = () => {
      if (timerSetting === 0) {
        timerSetting = 3;
        timerBtn.innerText = '⏱️ 3s';
        timerBtn.classList.add('active');
      } else if (timerSetting === 3) {
        timerSetting = 10;
        timerBtn.innerText = '⏱️ 10s';
        timerBtn.classList.add('active');
      } else {
        timerSetting = 0;
        timerBtn.innerText = '⏱️ Timer';
        timerBtn.classList.remove('active');
      }
    };

    // 3. Tap to Focus
    viewfinderWrapper.addEventListener('click', async (e) => {
      if (e.target.closest('.controls-overlay')) return;

      const rect = viewfinderWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      if (track && capabilities.focusMode) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        } catch (err) {}
      }
    });

    // 4. Authentic DSLR Shutter Sound Synthesizer (Matched to reference clack)
    function playDslrShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;

        // Part 1: Mirror Up Thump (Deep mechanical thud)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(160, now);
        osc1.frequency.exponentialRampToValueAtTime(45, now + 0.05);
        gain1.gain.setValueAtTime(0.8, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.05);

        // Part 2: Shutter Blade Open Click (Crisp high transient)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1200, now);
        osc2.frequency.exponentialRampToValueAtTime(350, now + 0.03);
        gain2.gain.setValueAtTime(0.5, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now);
        osc2.stop(now + 0.03);

        // Part 3: Mirror Down / Second Curtain Clack (Slightly delayed at +0.08s)
        const osc3 = audioCtx.createOscillator();
        const gain3 = audioCtx.createGain();
        osc3.type = 'triangle';
        osc3.frequency.setValueAtTime(130, now + 0.08);
        osc3.frequency.exponentialRampToValueAtTime(50, now + 0.13);
        gain3.gain.setValueAtTime(0.7, now + 0.08);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc3.connect(gain3);
        gain3.connect(audioCtx.destination);
        osc3.start(now + 0.08);
        osc3.stop(now + 0.13);

        // Part 4: Metallic Spring Clatter (Bandpass Noise Burst)
        const bufferSize = audioCtx.sampleRate * 0.14;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2800, now);
        filter.Q.setValueAtTime(4, now);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.6, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);
        noise.stop(now + 0.14);
      } catch (e) {}
    }

    // 5. Photo Capture Handler
    function triggerCapture() {
      if (isCountingDown || !video.videoWidth) return;

      if (timerSetting > 0) {
        isCountingDown = true;
        let count = timerSetting;
        countdownEl.innerText = count;
        countdownEl.style.display = 'block';

        const timerInterval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(timerInterval);
            countdownEl.style.display = 'none';
            isCountingDown = false;
            executeCaptureSequence();
          }
        }, 1000);
      } else {
        executeCaptureSequence();
      }
    }

    async function executeCaptureSequence() {
      const isFlashOn = (flashMode === 1);
      const wasAlwaysOn = (flashMode === 2);

      // True Flash Sequence: Turn torch ON, wait 250ms for LED to reach full illumination
      if (isFlashOn && track && capabilities.torch) {
        try {
          await track.applyConstraints({ advanced: [{ torch: true }] });
          await new Promise(r => setTimeout(r, 250)); // Proper flash warm-up delay
        } catch (e) {}
      }

      // Screen flash effect & DSLR shutter sound
      screenFlash.classList.add('active');
      setTimeout(() => screenFlash.classList.remove('active'), 120);

      playDslrShutterSound();

      // Draw photo to canvas
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.filter = video.style.filter || 'none';
      ctx.drawImage(video, 0, 0);

      // Turn off flash after capture (unless Always-On Light mode is active)
      if (isFlashOn && track && capabilities.torch && !wasAlwaysOn) {
        try {
          await track.applyConstraints({ advanced: [{ torch: false }] });
        } catch (e) {}
      }

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.download = `photo_${Date.now()}.jpg`;
      link.click();

      status.innerText = "✨ Photo Saved!";
      setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
    }

    document.getElementById('snapBtn').onclick = triggerCapture;

    // 6. Bluetooth Remote & Audio Activation
    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', triggerCapture);
      navigator.mediaSession.setActionHandler('pause', triggerCapture);
      navigator.mediaSession.setActionHandler('previoustrack', triggerCapture);
      navigator.mediaSession.setActionHandler('nexttrack', triggerCapture);
    }

    initCamera();
  </script>
</body>
</html>
