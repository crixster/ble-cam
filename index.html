<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    #viewfinderWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    canvas { display: none; }

    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.05s ease-out;
    }
    .screen-flash.active {
      opacity: 0.95;
    }

    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 2;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .countdown-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-grow: 1;
    }
    .icon-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .lens-bar {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .lens-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ccc;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-grow: 1;
      text-align: center;
      transition: all 0.2s;
    }
    .lens-btn.active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .slider-group label { min-width: 75px; color: #fff; font-weight: 500; }
    input[type=range] {
      flex-grow: 1;
      accent-color: #007aff;
      height: 6px;
      border-radius: 3px;
      background: #333;
    }

    .btn-row { display: flex; gap: 8px; }
    .main-btn {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
    }
    #installBtn { background: #34c759; display: none; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4); }
    #status { font-size: 11px; color: #888; text-align: center; margin: 0; }
  </style>
</head>
<body>

  <div id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="focus-ring" id="focusRing"></div>
    <div class="countdown-overlay" id="countdown"></div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <div class="controls-overlay">
    <div class="top-bar">
      <button class="icon-btn" id="flashBtn">⚡ Flash: Off</button>
      <button class="icon-btn" id="timerBtn">⏱️ Timer</button>
      <button class="icon-btn" id="flipBtn">🔄 Flip</button>
    </div>

    <div class="lens-bar">
      <button class="lens-btn" data-zoom="0.6">0.6x</button>
      <button class="lens-btn active" data-zoom="1">1x</button>
      <button class="lens-btn" data-zoom="2">2x</button>
      <button class="lens-btn" data-zoom="5">5x</button>
      <button class="lens-btn" data-zoom="10">10x</button>
    </div>

    <div class="slider-group">
      <label id="zoomLabel">Zoom: 1.0x</label>
      <input type="range" id="zoomSlider" min="0.6" max="10" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label id="expLabel">Bright: 0%</label>
      <input type="range" id="exposureSlider" min="50" max="150" step="1" value="100">
    </div>

    <div class="btn-row">
      <button class="main-btn" id="snapBtn">📸 Take Photo</button>
      <button class="main-btn" id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Tap screen to activate audio & remote</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // PWA Install Handling
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // Elements
    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    const focusRing = document.getElementById('focusRing');
    const countdownEl = document.getElementById('countdown');
    const viewfinderWrapper = document.getElementById('viewfinderWrapper');
    const screenFlash = document.getElementById('screenFlash');

    const flashBtn = document.getElementById('flashBtn');
    const timerBtn = document.getElementById('timerBtn');
    const flipBtn = document.getElementById('flipBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const exposureSlider = document.getElementById('exposureSlider');
    const expLabel = document.getElementById('expLabel');
    const lensButtons = document.querySelectorAll('.lens-btn');

    // App State
    let activeStream = null;
    let track = null;
    let capabilities = null;
    let audioCtx = null;
    let currentFacingMode = "environment";
    let flashMode = 0; // 0: Off, 1: Flash ON, 2: Light Always-On
    let timerSetting = 0; // 0, 3, or 10 seconds
    let isCountingDown = false;

    // Tunable constants for torch settling and timer blink cadence
    const TORCH_SETTLE_MS = 250;      // Settle delay for LED hardware state and auto-exposure stabilization
    const COUNTDOWN_PULSE_MS = 130;   // Duration of torch pulse per remaining countdown second
    const DOUBLE_BLINK_MS = 70;       // Duration of each blink in the pre-snap rapid double blink

    /**
     * Serialized torch helper: queues and awaits torch state changes to prevent race conditions
     * between countdown blinks, timer states, and capture sequences. Tracks internal state to make no-ops cheap.
     * Caveat: Front cameras generally do not expose torch capabilities; calls are safely short-circuited.
     */
    let torchQueue = Promise.resolve();
    let internalTorchState = false;

    function setTorch(on) {
      torchQueue = torchQueue.then(async () => {
        if (!track || !capabilities || !capabilities.torch || currentFacingMode === 'user') {
          return;
        }
        if (internalTorchState === on) return;
        try {
          await track.applyConstraints({ advanced: [{ torch: on }] });
          internalTorchState = on;
        } catch (e) {
          console.warn("Torch constraint failed:", e);
        }
      });
      return torchQueue;
    }

    // 1. Camera Initialization
    async function initCamera() {
      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });

        video.srcObject = activeStream;
        await video.play();

        track = activeStream.getVideoTracks()[0];
        capabilities = track.getCapabilities ? track.getCapabilities() : {};
        internalTorchState = false; // Reset on new stream

        if (capabilities.zoom) {
          zoomSlider.min = capabilities.zoom.min;
          zoomSlider.max = capabilities.zoom.max;
          zoomSlider.step = capabilities.zoom.step;
        }

        if (flashMode === 2 && capabilities.torch) {
          await setTorch(true);
        }

        status.innerText = "Ready • Press earbud to snap";
      } catch (err) {
        status.innerText = "Camera Error: " + err.message;
      }
    }

    async function applyZoom(val) {
      zoomSlider.value = val;
      zoomLabel.innerText = `Zoom: ${parseFloat(val).toFixed(1)}x`;

      lensButtons.forEach(btn => {
        if (parseFloat(btn.dataset.zoom) === parseFloat(val)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      try {
        if (capabilities.zoom && val >= capabilities.zoom.min && val <= capabilities.zoom.max) {
          await track.applyConstraints({ advanced: [{ zoom: val }] });
          video.style.transform = 'scale(1)';
        } else {
          video.style.transform = `scale(${val})`;
        }
      } catch (e) {
        video.style.transform = `scale(${val})`;
      }
    }

    lensButtons.forEach(btn => {
      btn.onclick = () => {
        const val = parseFloat(btn.dataset.zoom);
        applyZoom(val);
      };
    });

    zoomSlider.oninput = () => {
      applyZoom(parseFloat(zoomSlider.value));
    };

    // Flash Mode Cycling (Off -> Flash ON -> Light Always-On)
    flashBtn.onclick = async () => {
      flashMode = (flashMode + 1) % 3;
      
      if (flashMode === 0) {
        flashBtn.innerText = "⚡ Flash: Off";
        flashBtn.classList.remove('active');
        await setTorch(false);
      } else if (flashMode === 1) {
        flashBtn.innerText = "⚡ Flash: ON";
        flashBtn.classList.add('active');
        await setTorch(false);
      } else if (flashMode === 2) {
        flashBtn.innerText = "🔦 Light: Always-On";
        flashBtn.classList.add('active');
        await setTorch(true);
      }
    };

    exposureSlider.oninput = () => {
      const val = parseInt(exposureSlider.value);
      expLabel.innerText = `Bright: ${val}%`;
      video.style.filter = `brightness(${val}%)`;
    };

    flipBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      applyZoom(1);
      initCamera();
    };

    timerBtn.onclick = () => {
      if (timerSetting === 0) {
        timerSetting = 3;
        timerBtn.innerText = '⏱️ 3s';
        timerBtn.classList.add('active');
      } else if (timerSetting === 3) {
        timerSetting = 10;
        timerBtn.innerText = '⏱️ 10s';
        timerBtn.classList.add('active');
      } else {
        timerSetting = 0;
        timerBtn.innerText = '⏱️ Timer';
        timerBtn.classList.remove('active');
      }
    };

    viewfinderWrapper.addEventListener('click', async (e) => {
      if (e.target.closest('.controls-overlay')) return;

      const rect = viewfinderWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      if (track && capabilities.focusMode) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        } catch (err) {}
      }
    });

    /**
     * Synthesizes an authentic DSLR mechanical shutter sound using Web Audio API filtered noise buffers.
     * Generates a primary percussive mirror slap followed by a secondary mechanical click body, decaying exponentially.
     * Caveat: Relies on user gesture activation to unlock AudioContext playback in mobile browsers.
     */
    function playDslrShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;

        function createNoiseClick(startTime, duration, centerFreq, qVal, peakGain) {
          const bufferSize = audioCtx.sampleRate * duration;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const source = audioCtx.createBufferSource();
          source.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(centerFreq, startTime);
          filter.Q.setValueAtTime(qVal, startTime);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(peakGain, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          source.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          source.start(startTime);
          source.stop(startTime + duration);
        }

        // First click (mirror/shutter blade): ~12ms, bright (~4000Hz)
        createNoiseClick(now, 0.012, 4000, 3, 0.8);

        // Second click (mechanical body body): ~35ms starting 75ms later, lower center freq (~1800Hz)
        createNoiseClick(now + 0.075, 0.035, 1800, 2.5, 0.5);

      } catch (e) {
        console.warn("Audio playback failed:", e);
      }
    }

    /**
     * Executes the LED torch countdown blink sequence and pre-snap rapid double blink.
     * Pulses the torch on for each remaining second, then performs a rapid double blink before capture.
     * Falls back to CSS screen flashes if torch is unavailable or front camera is active.
     */
    async function runCountdownBlink(seconds) {
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      for (let i = seconds; i > 0; i--) {
        countdownEl.innerText = i;
        countdownEl.style.display = 'block';

        if (hasTorch) {
          await setTorch(true);
          await new Promise(r => setTimeout(r, COUNTDOWN_PULSE_MS));
          await setTorch(false);
          const remainder = 1000 - COUNTDOWN_PULSE_MS;
          await new Promise(r => setTimeout(r, remainder));
        } else {
          screenFlash.classList.add('active');
          setTimeout(() => screenFlash.classList.remove('active'), COUNTDOWN_PULSE_MS);
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      // Pre-snap rapid double blink (on-off-on-off)
      if (hasTorch) {
        await setTorch(true);
        await new Promise(r => setTimeout(r, DOUBLE_BLINK_MS));
        await setTorch(false);
        await new Promise(r => setTimeout(r, DOUBLE_BLINK_MS));
        await setTorch(true);
        await new Promise(r => setTimeout(r, DOUBLE_BLINK_MS));
        await setTorch(false);
      } else {
        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), DOUBLE_BLINK_MS);
        await new Promise(r => setTimeout(r, DOUBLE_BLINK_MS));
        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), DOUBLE_BLINK_MS);
      }

      countdownEl.style.display = 'none';
    }

    function triggerCapture() {
      if (isCountingDown || !video.videoWidth) return;

      if (timerSetting > 0) {
        isCountingDown = true;
        runCountdownBlink(timerSetting).then(() => {
          isCountingDown = false;
          executeCaptureSequence();
        });
      } else {
        executeCaptureSequence();
      }
    }

    /**
     * Executes the final photo capture sequence with serialized torch control, proper LED settle delay,
     * synthesized shutter sound, canvas frame grab, and reliable finally block restoration of torch state.
     */
    async function executeCaptureSequence() {
      const isFlashOn = (flashMode === 1);
      const isAlwaysOn = (flashMode === 2);
      const hasTorch = track && capabilities && capabilities.torch && currentFacingMode === 'environment';

      try {
        if (isFlashOn || isAlwaysOn) {
          if (hasTorch) {
            await setTorch(true);
            await new Promise(r => setTimeout(r, TORCH_SETTLE_MS));
          }
        }

        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), 120);

        playDslrShutterSound();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = video.style.filter || 'none';
        ctx.drawImage(video, 0, 0);

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.download = `photo_${Date.now()}.jpg`;
        link.click();

        status.innerText = "✨ Photo Saved!";
        setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
      } finally {
        if (hasTorch) {
          if (isAlwaysOn) {
            await setTorch(true);
          } else {
            await setTorch(false);
          }
        }
      }
    }

    document.getElementById('snapBtn').onclick = triggerCapture;

    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', triggerCapture);
      navigator.mediaSession.setActionHandler('pause', triggerCapture);
      navigator.mediaSession.setActionHandler('previoustrack', triggerCapture);
      navigator.mediaSession.setActionHandler('nexttrack', triggerCapture);
    }

    initCode = initCamera();
  </script>
</body>
</html>
