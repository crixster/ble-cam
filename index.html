<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Camera</title>
  
  <!-- Inline Manifest Data URL to force PWA installability without extra files -->
<link rel="manifest" href="./manifest.json">


  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }
    .viewfinder-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }
    
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn-row {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
    }
    /* Hidden by default until beforeinstallprompt fires */
    #installBtn {
      background: #34c759;
      display: none;
    }
    #status { font-size: 12px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <div class="viewfinder-container" id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline></video>
    <canvas id="photoCanvas"></canvas>
  </div>

  <div class="controls-overlay">
    <div class="btn-row">
      <button id="snapBtn">📸 Take Photo</button>
      <button id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Tap screen to activate audio & remote</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // -------------------------------------------------------------
    // 1. INLINE MANIFEST CREATION (Guarantees PWA requirements)
    // -------------------------------------------------------------
    const manifest = {
      name: "Remote Camera PWA",
      short_name: "CameraPWA",
      start_url: "./",
      display: "standalone",
      background_color: "#000000",
      theme_color: "#000000",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('manifestLink').setAttribute('href', manifestURL);

    // -------------------------------------------------------------
    // 2. SERVICE WORKER REGISTRATION (Mandatory for PWA Install)
    // -------------------------------------------------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed', err));
    }

    // -------------------------------------------------------------
    // 3. PWA INSTALL BUTTON LOGIC & AUTO-HIDE
    // -------------------------------------------------------------
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    // Check if app is already running in installed mode (standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isStandalone) {
      installBtn.style.display = 'none'; // Already installed & running as app
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        deferredPrompt = e;
        // Show the install button
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
      console.log('PWA installed successfully');
    });

    // -------------------------------------------------------------
    // 4. CAMERA & SHUTTER LOGIC
    // -------------------------------------------------------------
    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    let audioCtx = null;

    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        status.innerText = "Camera error: " + err.message;
      }
    }

    function takePhoto() {
      if (!video.videoWidth) return;
      playShutterSound();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.download = `photo_${Date.now()}.jpg`;
      link.click();
      status.innerText = "✨ Photo Saved!";
      setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
    }

    document.getElementById('snapBtn').onclick = takePhoto;
    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', takePhoto);
      navigator.mediaSession.setActionHandler('pause', takePhoto);
    }

    initCamera();
  </script>
</body>
</html>
