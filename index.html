<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Camera PWA</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    /* Fullscreen background video viewfinder */
    #viewfinderWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    canvas { display: none; }

    /* Focus Ring Animation */
    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      z-index: 2;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Countdown Overlay */
    .countdown-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    /* Floating Controls Overlay - Guaranteed to stay visible on screen */
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-grow: 1;
    }
    .icon-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .slider-group label { min-width: 75px; color: #fff; font-weight: 500; }
    input[type=range] {
      flex-grow: 1;
      accent-color: #007aff;
      height: 6px;
      border-radius: 3px;
      background: #333;
    }

    .btn-row { display: flex; gap: 8px; }
    .main-btn {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      background: #007aff;
      color: white;
      cursor: pointer;
      flex-grow: 1;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
    }
    #installBtn { background: #34c759; display: none; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4); }
    #status { font-size: 11px; color: #888; text-align: center; margin: 0; }
  </style>
</head>
<body>

  <!-- Fullscreen Viewfinder -->
  <div id="viewfinderWrapper">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="focus-ring" id="focusRing"></div>
    <div class="countdown-overlay" id="countdown"></div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <!-- Floating Control Panel -->
  <div class="controls-overlay">
    <!-- Top Bar: Torch, Timer, Flip -->
    <div class="top-bar">
      <button class="icon-btn" id="flashBtn">⚡ Torch</button>
      <button class="icon-btn" id="timerBtn">⏱️ Timer</button>
      <button class="icon-btn" id="flipBtn">🔄 Flip</button>
    </div>

    <!-- Software/Hardware Zoom Slider -->
    <div class="slider-group">
      <label id="zoomLabel">Zoom: 1.0x</label>
      <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
    </div>

    <!-- Brightness Slider -->
    <div class="slider-group">
      <label id="expLabel">Bright: 0%</label>
      <input type="range" id="exposureSlider" min="50" max="150" step="1" value="100">
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
      <button class="main-btn" id="snapBtn">📸 Take Photo</button>
      <button class="main-btn" id="installBtn">📲 Install App</button>
    </div>
    <p id="status">Tap screen to activate audio & remote</p>
  </div>

  <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // PWA Install Handling
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // Elements
    const video = document.getElementById('viewfinder');
    const canvas = document.getElementById('photoCanvas');
    const status = document.getElementById('status');
    const silentAudio = document.getElementById('silentAudio');
    const focusRing = document.getElementById('focusRing');
    const countdownEl = document.getElementById('countdown');
    const viewfinderWrapper = document.getElementById('viewfinderWrapper');

    const flashBtn = document.getElementById('flashBtn');
    const timerBtn = document.getElementById('timerBtn');
    const flipBtn = document.getElementById('flipBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const exposureSlider = document.getElementById('exposureSlider');
    const expLabel = document.getElementById('expLabel');

    // App State
    let activeStream = null;
    let track = null;
    let capabilities = null;
    let audioCtx = null;
    let currentFacingMode = "environment";
    let torchState = false;
    let timerSetting = 0; // 0, 3, or 10 seconds
    let isCountingDown = false;

    // 1. Camera Initialization
    async function initCamera() {
      try {
        if (activeStream) {
          activeStream.getTracks().forEach(t => t.stop());
        }

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });

        video.srcObject = activeStream;
        await video.play();

        track = activeStream.getVideoTracks()[0];
        capabilities = track.getCapabilities ? track.getCapabilities() : {};

        status.innerText = "Ready • Press earbud to snap";
      } catch (err) {
        status.innerText = "Camera Error: " + err.message;
      }
    }

    // 2. Zoom & Brightness Sliders
    zoomSlider.oninput = async () => {
      const val = parseFloat(zoomSlider.value);
      zoomLabel.innerText = `Zoom: ${val.toFixed(1)}x`;
      try {
        if (capabilities.zoom) {
          await track.applyConstraints({ advanced: [{ zoom: val }] });
        } else {
          video.style.transform = `scale(${val})`;
        }
      } catch (e) {
        video.style.transform = `scale(${val})`;
      }
    };

    exposureSlider.oninput = () => {
      const val = parseInt(exposureSlider.value);
      expLabel.innerText = `Bright: ${val}%`;
      video.style.filter = `brightness(${val}%)`;
    };

    // Torch / Flash Toggle
    flashBtn.onclick = async () => {
      if (!track || !capabilities.torch) {
        status.innerText = "Torch not supported on this sensor";
        setTimeout(() => status.innerText = "Ready", 2000);
        return;
      }
      torchState = !torchState;
      try {
        await track.applyConstraints({ advanced: [{ torch: torchState }] });
        flashBtn.classList.toggle('active', torchState);
        flashBtn.innerText = torchState ? '⚡ Torch ON' : '⚡ Torch';
      } catch (e) {}
    };

    // Camera Flip (Front / Back)
    flipBtn.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      zoomSlider.value = 1;
      zoomLabel.innerText = "Zoom: 1.0x";
      video.style.transform = "scale(1)";
      initCamera();
    };

    // Timer Toggle (Off -> 3s -> 10s)
    timerBtn.onclick = () => {
      if (timerSetting === 0) {
        timerSetting = 3;
        timerBtn.innerText = '⏱️ 3s';
        timerBtn.classList.add('active');
      } else if (timerSetting === 3) {
        timerSetting = 10;
        timerBtn.innerText = '⏱️ 10s';
        timerBtn.classList.add('active');
      } else {
        timerSetting = 0;
        timerBtn.innerText = '⏱️ Timer';
        timerBtn.classList.remove('active');
      }
    };

    // 3. Tap to Focus
    viewfinderWrapper.addEventListener('click', async (e) => {
      // Don't trigger focus if user taps inside control panel overlay
      if (e.target.closest('.controls-overlay')) return;

      const rect = viewfinderWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      if (track && capabilities.focusMode) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        } catch (err) {}
      }
    });

    // 4. Shutter Sound Synthesizer
    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // 5. Photo Capture Handler
    function triggerCapture() {
      if (isCountingDown || !video.videoWidth) return;

      if (timerSetting > 0) {
        isCountingDown = true;
        let count = timerSetting;
        countdownEl.innerText = count;
        countdownEl.style.display = 'block';

        const timerInterval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(timerInterval);
            countdownEl.style.display = 'none';
            isCountingDown = false;
            savePhoto();
          }
        }, 1000);
      } else {
        savePhoto();
      }
    }

    function savePhoto() {
      playShutterSound();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.filter = video.style.filter || 'none';
      ctx.drawImage(video, 0, 0);

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.download = `photo_${Date.now()}.jpg`;
      link.click();

      status.innerText = "✨ Photo Saved!";
      setTimeout(() => status.innerText = "Ready • Press earbud to snap", 2000);
    }

    document.getElementById('snapBtn').onclick = triggerCapture;

    // 6. Bluetooth Remote & Audio Activation
    document.body.addEventListener('click', () => {
      silentAudio.play().catch(() => {});
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', triggerCapture);
      navigator.mediaSession.setActionHandler('pause', triggerCapture);
      navigator.mediaSession.setActionHandler('previoustrack', triggerCapture);
      navigator.mediaSession.setActionHandler('nexttrack', triggerCapture);
    }

    initCamera();
  </script>
</body>
</html>
